sample:
  name: Wake up over UART
  description: "Wake on a UART byte, bridge host data to a phone over BLE, sleep when idle"
common:
  sysbuild: true
  build_only: true
  integration_platforms:
    - nrf52840dk/nrf52840
tests:
  sample.wakeup_over_uart:
    platform_allow:
      - nrf52840dk/nrf52840
